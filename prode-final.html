var saveTimer=null, guardado=true, cargando=true;

function signo(a,b){ return a>b?"L":a<b?"V":"E"; }
function jugado(p){ return typeof p.gLocal==="number"&&typeof p.gVisitante==="number"; }
function calcPts(pr,p){
  if(!jugado(p)) return null;
  if(!pr||!pr.resultado) return 0;
  return pr.resultado===signo(p.gLocal,p.gVisitante)?1:0;
}
function bloqueado(f){ return f?Date.now()>=new Date(f).getTime()-7200000:false; }
function clave(j,id){ return j+"__"+id; }

function guardar(){
  guardado=false; updIndicador();
  if(saveTimer) clearTimeout(saveTimer);
  saveTimer=setTimeout(function(){
    db.ref("prode2026/partidos").set(est.partidos);
    db.ref("prode2026/jugadores").set(est.jugadores);
    db.ref("prode2026/pronosticos").set(est.pronosticos).then(function(){
      guardado=true; updIndicador();
    });
  },900);
}

function escuchar(){
  db.ref("prode2026").on("value",function(snap){
    var d=snap.val();
    if(d){
      if(d.partidos){
        var ids={}; d.partidos.forEach(function(p){ids[p.id]=1;});
        var extras=PI.filter(function(p){return !ids[p.id];});
        est.partidos=d.partidos.concat(extras);
      }
      if(d.jugadores) est.jugadores=d.jugadores;
      if(d.pronosticos) est.pronosticos=d.pronosticos;
      if(est.jugadores.indexOf(jugAct)<0) jugAct=est.jugadores[0]||"";
    }
    cargando=false; render();
  });
}

function getFiltrados(){
  if(faseAct===F.G){
    var eqs=GE[grupoAct];
    return est.partidos.filter(function(p){
      return p.fase===F.G&&(eqs.indexOf(p.local)>=0||eqs.indexOf(p.visitante)>=0);
    });
  }
  return est.partidos.filter(function(p){return p.fase===faseAct;});
}

function getTabla(){
  return est.jugadores.map(function(j){
    var pts=0,ac=0,jug=0;
    est.partidos.forEach(function(p){
      if(!jugado(p)) return;
      jug++;
      var pu=calcPts(est.pronosticos[clave(j,p.id)],p)||0;
      pts+=pu; if(pu===1) ac++;
    });
    return {jugador:j,pts:pts,aciertos:ac,jugados:jug};
  }).sort(function(a,b){return b.pts-a.pts||b.aciertos-a.aciertos;});
}

  var pct=(jug/total*100).toFixed(1);
  return '<div style="font-size:21px;font-weight:700;color:#f5c518;margin-bottom:8px;letter-spacing:1px">Resultados Oficiales</div>'
    +'<p style="color:#5a7aaa;font-size:13px;margin-bottom:18px">Carg&aacute; el marcador real. Eliminatorias: 90\' + suplementario, <b style="color:#f59e0b">sin penales</b>.</p>'
    +htmlFases()+(faseAct===F.G?htmlGrupos()+eqRow:"")
    +'<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:13px;">'+cards+'</div>'
    +'<div style="margin-top:28px;">'
    +'<div style="font-size:12px;color:#5a7aaa;margin-bottom:6px">Progreso: '+jug+' / '+total+' partidos completados</div>'
    +'<div style="height:6px;background:#0d1f3a;border-radius:3px;overflow:hidden">'
    +'<div style="height:100%;background:#f5c518;border-radius:3px;width:'+pct+'%;transition:width .4s"></div>'
    +'</div></div>';
}

function htmlCardP(p){
  var ok=jugado(p), bloq=bloqueado(p.fechaISO), elim=FELIM.indexOf(p.fase)>=0;
  var bord=ok?"#22c55e55":"#1a3a6a";
  var h='<div style="background:#0d1f3a;border:1px solid '+bord+';border-radius:12px;padding:13px 16px;">'
    +'<div style="font-size:9px;color:#3a5a8a;margin-bottom:6px;letter-spacing:2px"><b style="color:#f5c518">'+p.cod+'</b> &middot; '+p.fase+(bloq?' <span style="color:#f59e0b;font-size:9px">&#x1F512;</span>':'')+'</div>'
    +(p.sede?'<div style="font-size:9px;color:#3a5a8a;margin-bottom:6px">&#x1F4CD; '+p.sede+'</div>':"")
    +'<div style="margin-bottom:8px"><input type="datetime-local" data-pid="'+p.id+'" data-field="fecha" style="background:#0a1628;border:1px solid #2a4a7a;border-radius:6px;color:#7090c0;padding:4px 8px;font-size:11px;outline:none;width:100%;box-sizing:border-box;" value="'+(p.fechaISO?p.fechaISO.slice(0,16):"")+'"/></div>';
  if(elim){
    h+='<div style="display:flex;gap:5px;margin-bottom:8px;align-items:center;">'
      +'<input data-pid="'+p.id+'" data-field="local" value="'+p.local+'" style="flex:1;background:#0a1628;border:1px solid #2a4a7a;border-radius:6px;color:#e8eaf0;padding:4px 8px;font-size:11px;outline:none;font-family:Georgia,serif"/>'
      +'<span style="color:#3a5a8a;font-weight:700;flex-shrink:0">vs</span>'
      +'<input data-pid="'+p.id+'" data-field="visitante" value="'+p.visitante+'" style="flex:1;background:#0a1628;border:1px solid #2a4a7a;border-radius:6px;color:#e8eaf0;padding:4px 8px;font-size:11px;outline:none;font-family:Georgia,serif"/>'
      +'</div>';
  }
  h+='<div style="display:flex;align-items:center;justify-content:space-between;gap:5px;">'
    +'<div style="display:flex;align-items:center;gap:4px;flex:1;min-width:0;"><span style="font-size:19px;flex-shrink:0">'+bf(p.local)+'</span><span style="font-size:12px;font-weight:600;color:#c0d0e8;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+p.local+'</span></div>'
    +'<div style="display:flex;align-items:center;gap:3px;flex-shrink:0">'
    +'<input type="number" min="0" max="20" data-pid="'+p.id+'" data-field="gLocal" style="width:38px;height:32px;text-align:center;background:#0a1628;border:1px solid #2a4a7a;border-radius:6px;color:#f5c518;font-size:16px;font-weight:700;outline:none;font-family:monospace" value="'+(p.gLocal!==null&&p.gLocal!==undefined?p.gLocal:"")+'"/>'
    +'<span style="color:#3a5a8a;font-weight:700;font-size:15px">:</span>'
    +'<input type="number" min="0" max="20" data-pid="'+p.id+'" data-field="gVisitante" style="width:38px;height:32px;text-align:center;background:#0a1628;border:1px solid #2a4a7a;border-radius:6px;color:#f5c518;font-size:16px;font-weight:700;outline:none;font-family:monospace" value="'+(p.gVisitante!==null&&p.gVisitante!==undefined?p.gVisitante:"")+'"/>'
    +'</div>'
    +'<div style="display:flex;align-items:center;gap:4px;flex:1;min-width:0;justify-content:flex-end;"><span style="font-size:12px;font-weight:600;color:#c0d0e8;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+p.visitante+'</span><span style="font-size:19px;flex-shrink:0">'+bf(p.visitante)+'</span></div>'
    +'</div>';
  if(ok){
    var res=signo(p.gLocal,p.gVisitante);
    h+='<div style="margin-top:7px;text-align:center;font-size:11px;color:#22c55e">&#x2713; '+p.gLocal+'&ndash;'+p.gVisitante+' &middot; '+(res==="L"?p.local:res==="V"?p.visitante:"Empate")+'</div>';
  }
  return h+'</div>';
}

function htmlProns(){
  var ps=getFiltrados();
  var jugH="";
  est.jugadores.forEach(function(j){
    var act=j===jugAct;
    var bg=act?"#f5c518":"#0a1628", br=act?"#f5c518":"#1a3a6a", co=act?"#050d1a":"#7090c0", fw=act?700:400;
    jugH+='<div style="display:flex;align-items:center;">'
      +'<button data-sel="'+j+'" style="background:'+bg+';border:1px solid '+br+';color:'+co+';padding:5px 13px;border-radius:20px 0 0 20px;border-right:none;cursor:pointer;font-size:13px;font-family:Georgia,serif;font-weight:'+fw+'">'+j+'</button>'
      +'<button data-del="'+j+'" style="background:'+bg+';border:1px solid '+br+';color:#ef4444;padding:5px 9px;border-radius:0 20px 20px 0;cursor:pointer;font-size:13px;font-family:Georgia,serif">&#x2715;</button>'
      +'</div>';
  });
  var grupoInfo="";
  if(faseAct===F.G) GE[grupoAct].forEach(function(e){ grupoInfo+=" &middot; "+bf(e)+" "+e; });
  var cards="";
  ps.forEach(function(p){ cards+=htmlCardPron(p); });
  return '<div style="font-size:21px;font-weight:700;color:#f5c518;margin-bottom:8px;letter-spacing:1px">Pron&oacute;sticos</div>'
    +'<p style="color:#5a7aaa;font-size:13px;margin-bottom:14px">Eleg&iacute; <b style="color:#f5c518">L</b> (local), <b style="color:#f5c518">E</b> (empate) o <b style="color:#f5c518">V</b> (visitante). Bloqueo autom&aacute;tico <b style="color:#f59e0b">2 horas antes</b>.</p>'
    +'<div style="background:#0d1f3a;border:1px solid #1a3a6a;border-radius:10px;padding:11px 15px;margin-bottom:16px;display:flex;align-items:center;flex-wrap:wrap;gap:9px;">'
    +'<span style="color:#3a5a8a;font-size:10px;letter-spacing:3px;flex-shrink:0">JUGADORES</span>'
    +'<div style="display:flex;flex-wrap:wrap;gap:7px;flex:1">'+jugH+'</div>'
    +'<div style="display:flex;gap:7px;">'
    +'<input id="nj" placeholder="Nuevo jugador..." style="background:#0a1628;border:1px solid #1a3a6a;color:#e8eaf0;padding:5px 11px;border-radius:8px;font-size:13px;outline:none;font-family:Georgia,serif"/>'
    +'<button id="btnag" style="background:#1a3a6a;border:none;color:#f5c518;padding:5px 13px;border-radius:8px;cursor:pointer;font-size:13px;font-family:Georgia,serif">+ Agregar</button>'
    +'</div></div>'
    +htmlFases()+(faseAct===F.G?htmlGrupos():"")
    +'<div style="font-size:13px;color:#5a7aaa;margin-bottom:14px"><b style="color:#f5c518">'+jugAct+'</b> &middot; '+faseAct+grupoInfo+'</div>'
    +'<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:13px;">'+cards+'</div>'
    +htmlResumen();
}

function htmlCardPron(p){
  var k=clave(jugAct,p.id), pr=est.pronosticos[k]||{};
  var ok=jugado(p), pts=ok?calcPts(pr,p):null, bloq=bloqueado(p.fechaISO);
  var realR=ok?signo(p.gLocal,p.gVisitante):null;
  var fechaStr="";
  if(p.fechaISO){
    var d=new Date(p.fechaISO);
    fechaStr="&#x1F5D3; "+d.toLocaleDateString("es-AR",{weekday:"short",day:"numeric",month:"short"})+" &middot; "+d.toLocaleTimeString("es-AR",{hour:"2-digit",minute:"2-digit"})+" hs";
  }
  var h='<div style="background:#0d1f3a;border:1px solid #1a3a6a;border-radius:12px;padding:13px 16px;position:relative;'+(bloq?"opacity:.88;":"")+'opacity:'+(bloq?".88":"1")+';">';
  if(pts!==null) h+='<div style="position:absolute;top:10px;right:10px;background:'+(pts===1?"#22c55e":"#ef4444")+';color:#fff;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:700">'+pts+' pt</div>';
  h+='<div style="font-size:9px;color:#3a5a8a;margin-bottom:6px;letter-spacing:2px"><b style="color:#f5c518">'+p.cod+'</b> &middot; '+p.fase+(bloq?' <span style="color:#f59e0b;font-size:9px">&#x1F512; Bloqueado</span>':"")+'</div>'
    +(p.sede?'<div style="font-size:9px;color:#3a5a8a;margin-bottom:5px">&#x1F4CD; '+p.sede+'</div>':"")
    +(fechaStr?'<div style="font-size:10px;color:#5a7aaa;margin-bottom:7px">'+fechaStr+'</div>':"")
    +'<div style="display:flex;align-items:center;justify-content:space-between;gap:5px;margin-bottom:10px">'
    +'<div style="display:flex;align-items:center;gap:4px;flex:1;min-width:0"><span style="font-size:19px">'+bf(p.local)+'</span><span style="font-size:12px;font-weight:600;color:#c0d0e8;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+p.local+'</span></div>'
    +'<span style="color:#3a5a8a;font-size:11px;flex-shrink:0">vs</span>'
    +'<div style="display:flex;align-items:center;gap:4px;flex:1;min-width:0;justify-content:flex-end"><span style="font-size:12px;font-weight:600;color:#c0d0e8;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+p.visitante+'</span><span style="font-size:19px">'+bf(p.visitante)+'</span></div>'
    +'</div><div style="display:flex;gap:6px;justify-content:center;">';
  var bts=[{v:"L",l:"Local",c:"#3a7aff"},{v:"E",l:"Empate",c:"#7090c0"},{v:"V",l:"Visitante",c:"#f59e0b"}];
  bts.forEach(function(bt){
    var sel=pr.resultado===bt.v, corr=ok&&realR===bt.v;
    var bg=sel?bt.c:"transparent";
    var brd=sel?bt.c:(ok&&corr?"#22c55e":"#1a3a6a");
    var col=sel?"#fff":(ok&&corr?"#22c55e":bt.c);
    var shadow=sel?"0 0 10px "+bt.c+"66":"none";
    var dis=bloq?"disabled":"";
    h+='<button data-pron="'+p.id+'" data-val="'+bt.v+'" '+dis+' style="flex:1;border:1px solid '+brd+';border-radius:8px;padding:8px 4px;background:'+bg+';color:'+col+';cursor:'+(bloq?"not-allowed":"pointer")+';opacity:'+(bloq?.6:1)+';box-shadow:'+shadow+';font-family:Georgia,serif;transition:all .2s;">'
      +'<div style="font-size:15px;font-weight:800">'+bt.v+'</div>'
      +'<div style="font-size:9px;margin-top:1px;opacity:.8">'+bt.l+'</div>'
      +'</button>';
  });
  h+='</div>';
  if(ok) h+='<div style="margin-top:8px;text-align:center;font-size:11px;color:#5a7aaa">Real: '+p.gLocal+'&ndash;'+p.gVisitante+' &middot; ('+(realR==="L"?"Local":realR==="V"?"Visitante":"Empate")+')</div>';
  return h+'</div>';
}

function htmlResumen(){
  var jug=est.partidos.filter(jugado);
  if(!jug.length) return "";
  var ac=jug.filter(function(p){return calcPts(est.pronosticos[clave(jugAct,p.id)],p)===1;}).length;
  var pts=jug.reduce(function(acc,p){return acc+(calcPts(est.pronosticos[clave(jugAct,p.id)],p)||0);},0);
  var items=[{l:"Partidos",v:jug.length,c:"#7090c0"},{l:"Aciertos",v:ac,c:"#22c55e"},{l:"Errores",v:jug.length-ac,c:"#ef4444"},{l:"Puntos",v:pts,c:"#f5c518"}];
  var cells="";
  items.forEach(function(it){
    cells+='<div style="background:#0a1628;border-radius:8px;padding:10px 14px;text-align:center;">'
      +'<div style="font-size:26px;font-weight:700;color:'+it.c+'">'+it.v+'</div>'
      +'<div style="font-size:10px;color:#5a7aaa;margin-top:2px">'+it.l+'</div>'
      +'</div>';
  });
  return '<div style="background:#0d1f3a;border:1px solid #1a3a6a;border-radius:12px;padding:16px 20px;margin-top:22px;">'
    +'<div style="font-size:11px;color:#5a7aaa;letter-spacing:2px;margin-bottom:12px">RESUMEN DE '+jugAct.toUpperCase()+'</div>'
    +'<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:10px;">'+cells+'</div>'
    +'</div>';
}

function htmlTabla(){
  var tabla=getTabla();
  var jug=est.partidos.filter(jugado);
  var rows="";
  tabla.forEach(function(row,i){
    var medal=i===0?"&#x1F947;":i===1?"&#x1F948;":i===2?"&#x1F949;":(i+1);
    var mc=i===0?"#f5c518":i===1?"#aaa":i===2?"#cd7f32":"#555";
    var bgPts=i===0?"#f5c518":"#1a3a6a", coPts=i===0?"#050d1a":"#f5c518", szPts=i===0?17:14;
    rows+='<tr style="border-bottom:1px solid #0a1628;'+(i===0?"background:#1a2a1a;":"")+'"">'
      +'<td style="padding:10px 13px;font-size:13px;color:'+mc+';text-align:center;font-weight:700">'+medal+'</td>'
      +'<td style="padding:10px 13px;font-size:15px;font-weight:600;color:#c0d0e8">'+row.jugador+'</td>'
      +'<td style="padding:10px 13px;font-size:13px;color:#888;text-align:center">'+row.jugados+'</td>'
      +'<td style="padding:10px 13px;font-size:13px;color:#22c55e;text-align:center">'+row.aciertos+'</td>'
      +'<td style="padding:10px 13px;text-align:center"><span style="background:'+bgPts+';color:'+coPts+';padding:3px 11px;border-radius:20px;font-weight:700;font-size:'+szPts+'px">'+row.pts+'</span></td>'
      +'</tr>';
  });
  var det=tabla.length>0&&jug.length>0?htmlDetalle():"";
  return '<div style="font-size:21px;font-weight:700;color:#f5c518;margin-bottom:8px;letter-spacing:1px">&#x1F3C6; Tabla de Posiciones</div>'
    +'<p style="color:#5a7aaa;font-size:13px;margin-bottom:18px"><b style="color:#22c55e">1 pt</b> por acertar L / E / V.</p>'
    +'<div style="overflow-x:auto;"><table style="width:100%;border-collapse:collapse;background:#0d1f3a;border-radius:12px;overflow:hidden;">'
    +'<thead><tr>'
    +'<th style="background:#0a1628;color:#5a7aaa;padding:10px 13px;font-size:11px;letter-spacing:2px;text-align:center;border-bottom:1px solid #1a3a6a;width:40px">#</th>'
    +'<th style="background:#0a1628;color:#5a7aaa;padding:10px 13px;font-size:11px;letter-spacing:2px;text-align:left;border-bottom:1px solid #1a3a6a;">Jugador</th>'
    +'<th style="background:#0a1628;color:#5a7aaa;padding:10px 13px;font-size:11px;letter-spacing:2px;text-align:center;border-bottom:1px solid #1a3a6a;">Partidos</th>'
    +'<th style="background:#0a1628;color:#5a7aaa;padding:10px 13px;font-size:11px;letter-spacing:2px;text-align:center;border-bottom:1px solid #1a3a6a;">&#x2705; Aciertos</th>'
    +'<th style="background:#0a1628;color:#5a7aaa;padding:10px 13px;font-size:15px;letter-spacing:2px;text-align:center;border-bottom:1px solid #1a3a6a;">Pts</th>'
    +'</tr></thead><tbody>'+rows+'</tbody></table></div>'+det;
}

function htmlDetalle(){
  var jug=est.partidos.filter(jugado);
  var ths="";
  est.jugadores.forEach(function(j){ ths+='<th style="background:#0a1628;color:#5a7aaa;padding:10px 13px;font-size:10px;text-align:center;border-bottom:1px solid #1a3a6a;min-width:75px">'+j+'</th>'; });
  var rows="";
  jug.forEach(function(p){
    var realR=signo(p.gLocal,p.gVisitante);
    var tds="";
    est.jugadores.forEach(function(j){
      var pr=est.pronosticos[clave(j,p.id)]||{}, pts=calcPts(pr,p);
      tds+=pr.resultado
        ?'<td style="padding:10px 13px;text-align:center"><span style="color:'+(pts===1?"#22c55e":"#ef4444")+';font-weight:700">'+pr.resultado+(pts===1?"&#x2705;":"&#x274C;")+'</span></td>'
        :'<td style="padding:10px 13px;text-align:center;color:#333">&mdash;</td>';
    });
    rows+='<tr style="border-bottom:1px solid #0a1628">'
      +'<td style="padding:10px 13px;font-size:11px;color:#f5c518;font-weight:700">'+p.cod+'</td>'
      +'<td style="padding:10px 13px;font-size:11px;color:#c0d0e8">'+bf(p.local)+' '+p.local+' vs '+p.visitante+' '+bf(p.visitante)+'</td>'
      +'<td style="padding:10px 13px;text-align:center;font-weight:700;color:#f5c518">'+realR+'</td>'
      +tds+'</tr>';
  });
  return '<div style="margin-top:36px;">'
    +'<div style="font-size:16px;font-weight:700;color:#f5c518;margin-bottom:10px;letter-spacing:1px">Detalle por partido jugado</div>'
    +'<div style="overflow-x:auto;"><table style="width:100%;border-collapse:collapse;background:#0d1f3a;min-width:500px;">'
    +'<thead><tr>'
    +'<th style="background:#0a1628;color:#5a7aaa;padding:10px 13px;font-size:11px;text-align:left;border-bottom:1px solid #1a3a6a;min-width:50px">C&oacute;d</th>'
    +'<th style="background:#0a1628;color:#5a7aaa;padding:10px 13px;font-size:11px;text-align:left;border-bottom:1px solid #1a3a6a;min-width:150px">Partido</th>'
    +'<th style="background:#0a1628;color:#5a7aaa;padding:10px 13px;font-size:11px;text-align:center;border-bottom:1px solid #1a3a6a;min-width:40px">Real</th>'
    +ths+'</tr></thead><tbody>'+rows+'</tbody></table></div></div>';
}

// ── EVENTOS ──────────────────────────────────────────────────────────────────
function bind(){
  document.querySelectorAll("[data-tab]").forEach(function(b){
    b.onclick=function(){ tabAct=this.getAttribute("data-tab"); render(); };
  });
  document.querySelectorAll("[data-fase]").forEach(function(b){
    b.onclick=function(){ faseAct=this.getAttribute("data-fase"); render(); };
  });
  document.querySelectorAll("[data-grupo]").forEach(function(b){
    b.onclick=function(){ grupoAct=this.getAttribute("data-grupo"); render(); };
  });
  document.querySelectorAll("[data-sel]").forEach(function(b){
    b.onclick=function(){ jugAct=this.getAttribute("data-sel"); render(); };
  });
  document.querySelectorAll("[data-del]").forEach(function(b){
    b.onclick=function(){
      var j=this.getAttribute("data-del");
      if(!confirm("Eliminar a "+j+" del PRODE?")) return;
      est.jugadores=est.jugadores.filter(function(x){return x!==j;});
      Object.keys(est.pronosticos).forEach(function(k){if(k.indexOf(j+"__")===0) delete est.pronosticos[k];});
      if(jugAct===j) jugAct=est.jugadores[0]||"";
      guardar(); render();
    };
  });
  document.querySelectorAll("[data-pron]").forEach(function(b){
    b.onclick=function(){
      var pid=+this.getAttribute("data-pron"), val=this.getAttribute("data-val");
      var k=clave(jugAct,pid);
      if(!est.pronosticos[k]) est.pronosticos[k]={};
      est.pronosticos[k].resultado=val;
      guardar(); render();
    };
  });
  document.querySelectorAll("input[data-pid][data-field]").forEach(function(inp){
    inp.onchange=function(){
      var pid=+this.getAttribute("data-pid"), f=this.getAttribute("data-field");
      var p=est.partidos.filter(function(x){return x.id===pid;})[0];
      if(!p) return;
      if(f==="gLocal"||f==="gVisitante") p[f]=this.value===""?null:Number(this.value);
      else if(f==="fecha") p.fechaISO=this.value?this.value+":00":null;
      else p[f]=this.value;
      guardar(); render();
    };
  });
  var btnag=document.getElementById("btnag"), nj=document.getElementById("nj");
  function agregar(){
    var n=nj?nj.value.trim():"";
    if(n&&est.jugadores.indexOf(n)<0){ est.jugadores.push(n); jugAct=n; guardar(); render(); }
  }
  if(btnag) btnag.onclick=agregar;
  if(nj) nj.onkeydown=function(e){if(e.key==="Enter") agregar();};
}

// ── INIT ─────────────────────────────────────────────────────────────────────
document.getElementById("app").innerHTML=htmlLoad();
escuchar();
</script>
