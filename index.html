// ── Firebase helpers ─────────────────────────────────────────────────────────
function guardarEnFirebase() {
  estadoGuardado = false;
  renderHeader();
  if (saveTimer) clearTimeout(saveTimer);
  saveTimer = setTimeout(async () => {
    try {
      await db.ref("prode2026/partidos").set(estado.partidos);
      await db.ref("prode2026/jugadores").set(estado.jugadores);
      await db.ref("prode2026/pronosticos").set(estado.pronosticos);
      estadoGuardado = true;
      renderHeader();
    } catch(e) {
      console.error("Error al guardar:", e);
    }
  }, 900);
}

function escucharFirebase() {
  db.ref("prode2026").on("value", snap => {
    const data = snap.val();
    if (data) {
      if (data.partidos) {
        const savedIds = new Set(data.partidos.map(p => p.id));
        const extras = PARTIDOS_INICIALES.filter(p => !savedIds.has(p.id));
        estado.partidos = [...data.partidos, ...extras];
      }
      if (data.jugadores)    estado.jugadores   = data.jugadores;
      if (data.pronosticos)  estado.pronosticos = data.pronosticos;
      if (!estado.jugadores.includes(jugadorActivo)) jugadorActivo = estado.jugadores[0] || "";
    }
    if (cargando) { cargando = false; renderApp(); }
    else renderApp();
  });
}

// ── Lógica ───────────────────────────────────────────────────────────────────
function signo(a,b){ return a>b?"L":a<b?"V":"E"; }
function calcPuntos(pron,p){
  // Solo puntúa si AMBOS goles están cargados con un número válido
  if(p.gLocal===null||p.gLocal===undefined||p.gVisitante===null||p.gVisitante===undefined) return null;
  if(typeof p.gLocal!=="number"||typeof p.gVisitante!=="number") return null;
  if(!pron||!pron.resultado) return 0;
  return pron.resultado===signo(p.gLocal,p.gVisitante)?1:0;
}
function esBloqueado(fechaISO){
  if(!fechaISO) return false;
  return Date.now() >= new Date(fechaISO).getTime() - 2*3600*1000;
}
function partidoJugado(p){
  return typeof p.gLocal==="number" && typeof p.gVisitante==="number";
}

function getPartidosFiltrados(){
  if(faseActiva===FASES.GRUPOS){
    const eqs=GRUPOS_EQUIPOS[grupoActivo];
    return estado.partidos.filter(p=>p.fase===FASES.GRUPOS&&(eqs.includes(p.local)||eqs.includes(p.visitante)));
  }
  return estado.partidos.filter(p=>p.fase===faseActiva);
}

function getTabla(){
  return estado.jugadores.map(j=>{
    let pts=0,aciertos=0,jugados=0;
    estado.partidos.forEach(p=>{
      if(!partidoJugado(p)) return;
      jugados++;
      const pu=calcPuntos(estado.pronosticos[clave(j,p.id)],p)||0;
      pts+=pu; if(pu===1) aciertos++;
    });
    return{jugador:j,pts,aciertos,jugados};
  }).sort((a,b)=>b.pts-a.pts||b.aciertos-a.aciertos);
}

    ${Object.values(FASES).map(f=>`<button data-fase="${f}" style="background:${faseActiva===f?"#1a3a6a":"#0a1628"};border:1px solid ${faseActiva===f?"#f5c518":"#1a3a6a"};color:${faseActiva===f?"#f5c518":"#7090c0"};padding:5px 13px;border-radius:20px;cursor:pointer;font-size:11px;font-family:Georgia,serif">${f}</button>`).join("")}
  </div>`;
}
function htmlSelectorGrupos(){
  return `<div style="display:flex;flex-wrap:wrap;gap:7px;margin-bottom:14px;">
    ${GRUPOS_LIST.map(g=>`<button data-grupo="${g}" style="background:${grupoActivo===g?"#1a3a6a":"#0a1628"};border:1px solid ${grupoActivo===g?"#f5c518":"#1a3a6a"};color:${grupoActivo===g?"#f5c518":"#7090c0"};padding:4px 11px;border-radius:20px;cursor:pointer;font-size:12px;font-family:Georgia,serif">G ${g}</button>`).join("")}
  </div>`;
}

function htmlPartidos(){
  const partidos = getPartidosFiltrados();
  const jugados = estado.partidos.filter(p=>partidoJugado(p));
  const total = estado.partidos.length;
  const cantJugados = jugados.length;
  return `
  <div style="font-size:21px;font-weight:700;color:#f5c518;margin-bottom:8px;letter-spacing:1px">Resultados Oficiales</div>
  <p style="color:#5a7aaa;font-size:13px;margin-bottom:18px">Cargá el marcador real. Eliminatorias: 90' + tiempo suplementario, <b style="color:#f59e0b">sin penales</b>.</p>
  ${htmlSelectorFase()}
  ${faseActiva===FASES.GRUPOS ? htmlSelectorGrupos()+"<div style='display:flex;flex-wrap:wrap;gap:7px;margin-bottom:16px;'>"+GRUPOS_EQUIPOS[grupoActivo].map(eq=>`<div style="background:#0d1f3a;border:1px solid #1a3a6a;border-radius:20px;padding:4px 13px;font-size:13px;color:#c0d0e8">${bf(eq)} ${eq}</div>`).join("")+"</div>" : ""}
  <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:13px;">
    ${partidos.map(p=>htmlCardPartido(p)).join("")}
  </div>
  <div style="margin-top:28px;">
    <div style="font-size:12px;color:#5a7aaa;margin-bottom:6px">Progreso: ${cantJugados} / ${total} partidos completados</div>
    <div style="height:6px;background:#0d1f3a;border-radius:3px;overflow:hidden">
      <div style="height:100%;background:#f5c518;border-radius:3px;width:${(cantJugados/total*100).toFixed(1)}%;transition:width .4s"></div>
    </div>
  </div>`;
}

function htmlCardPartido(p){
  const ok = partidoJugado(p);
  const bloq = esBloqueado(p.fechaISO);
  const esElim = FASES_ELIM.includes(p.fase);
  const fechaStr = p.fechaISO ? new Date(p.fechaISO).toLocaleDateString("es-AR",{weekday:"short",day:"numeric",month:"short"})+" "+new Date(p.fechaISO).toLocaleTimeString("es-AR",{hour:"2-digit",minute:"2-digit"})+" hs" : "";
  return `
  <div style="background:#0d1f3a;border:1px solid ${ok?"#22c55e55":"#1a3a6a"};border-radius:12px;padding:13px 16px;">
    <div style="font-size:9px;color:#3a5a8a;margin-bottom:6px;letter-spacing:2px"><b style="color:#f5c518">${p.cod}</b> · ${p.fase}${bloq?'<span style="margin-left:7px;color:#f59e0b;font-size:9px">🔒</span>':""}</div>
    ${p.sede?`<div style="font-size:9px;color:#3a5a8a;margin-bottom:6px">📍 ${p.sede}</div>`:""}
    <div style="margin-bottom:8px">
      <input type="datetime-local" data-pid="${p.id}" data-field="fecha"
        style="background:#0a1628;border:1px solid #2a4a7a;border-radius:6px;color:#7090c0;padding:4px 8px;font-size:11px;outline:none;width:100%;box-sizing:border-box;"
        value="${p.fechaISO?p.fechaISO.slice(0,16):""}"/>
    </div>
    ${esElim?`<div style="display:flex;gap:5px;margin-bottom:8px;align-items:center;">
      <input data-pid="${p.id}" data-field="local" value="${p.local}" placeholder="Local"
        style="flex:1;background:#0a1628;border:1px solid #2a4a7a;border-radius:6px;color:#e8eaf0;padding:4px 8px;font-size:11px;outline:none;font-family:Georgia,serif"/>
      <span style="color:#3a5a8a;font-weight:700;flex-shrink:0">vs</span>
      <input data-pid="${p.id}" data-field="visitante" value="${p.visitante}" placeholder="Visitante"
        style="flex:1;background:#0a1628;border:1px solid #2a4a7a;border-radius:6px;color:#e8eaf0;padding:4px 8px;font-size:11px;outline:none;font-family:Georgia,serif"/>
    </div>`:""}
    <div style="display:flex;align-items:center;justify-content:space-between;gap:5px;">
      <div style="display:flex;align-items:center;gap:4px;flex:1;min-width:0;">
        <span style="font-size:19px;flex-shrink:0">${bf(p.local)}</span>
        <span style="font-size:12px;font-weight:600;color:#c0d0e8;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${p.local}</span>
      </div>
      <div style="display:flex;align-items:center;gap:3px;flex-shrink:0">
        <input type="number" min="0" max="20" data-pid="${p.id}" data-field="gLocal"
          style="width:38px;height:32px;text-align:center;background:#0a1628;border:1px solid #2a4a7a;border-radius:6px;color:#f5c518;font-size:16px;font-weight:700;outline:none;font-family:monospace"
          value="${p.gLocal??""}" placeholder="–"/>
        <span style="color:#3a5a8a;font-weight:700;font-size:15px">:</span>
        <input type="number" min="0" max="20" data-pid="${p.id}" data-field="gVisitante"
          style="width:38px;height:32px;text-align:center;background:#0a1628;border:1px solid #2a4a7a;border-radius:6px;color:#f5c518;font-size:16px;font-weight:700;outline:none;font-family:monospace"
          value="${p.gVisitante??""}" placeholder="–"/>
      </div>
      <div style="display:flex;align-items:center;gap:4px;flex:1;min-width:0;justify-content:flex-end;">
        <span style="font-size:12px;font-weight:600;color:#c0d0e8;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${p.visitante}</span>
        <span style="font-size:19px;flex-shrink:0">${bf(p.visitante)}</span>
      </div>
    </div>
    ${ok?`<div style="margin-top:7px;text-align:center;font-size:11px;color:#22c55e">✓ ${p.gLocal}–${p.gVisitante} · ${signo(p.gLocal,p.gVisitante)==="L"?p.local:signo(p.gLocal,p.gVisitante)==="V"?p.visitante:"Empate"}</div>`:""}
  </div>`;
}

function htmlPronosticos(){
  const partidos = getPartidosFiltrados();
  let jugadoresHtml = "";
  for(let i=0;i<estado.jugadores.length;i++){
    const j=estado.jugadores[i];
    const esActivo=(j===jugadorActivo);
    const bgA=esActivo?"#f5c518":"#0a1628";
    const brA=esActivo?"#f5c518":"#1a3a6a";
    const coA=esActivo?"#050d1a":"#7090c0";
    const fw=esActivo?"700":"400";
    jugadoresHtml+=
      '<div style="display:flex;align-items:center;">'+
        '<button data-sel-jugador="'+j+'" style="background:'+bgA+';border:1px solid '+brA+';color:'+coA+';padding:5px 13px;border-radius:20px 0 0 20px;border-right:none;cursor:pointer;font-size:13px;font-family:Georgia,serif;font-weight:'+fw+'">'+j+'</button>'+
        '<button data-del-jugador="'+j+'" style="background:'+bgA+';border:1px solid '+brA+';color:#ef4444;padding:5px 9px;border-radius:0 20px 20px 0;cursor:pointer;font-size:13px;font-family:Georgia,serif">&#x2715;</button>'+
      '</div>';
  }
  let grupoInfo="";
  if(faseActiva===FASES.GRUPOS){
    const eqs=GRUPOS_EQUIPOS[grupoActivo];
    for(let i=0;i<eqs.length;i++) grupoInfo+=" &middot; "+bf(eqs[i])+" "+eqs[i];
  }
  return '<div style="font-size:21px;font-weight:700;color:#f5c518;margin-bottom:8px;letter-spacing:1px">Pron&#xF3;sticos</div>'+
    '<p style="color:#5a7aaa;font-size:13px;margin-bottom:14px">Elegi <b style="color:#f5c518">L</b> (local), <b style="color:#f5c518">E</b> (empate) o <b style="color:#f5c518">V</b> (visitante). Bloqueo autom&#xE1;tico <b style="color:#f59e0b">2 horas antes</b> del partido.</p>'+
    '<div style="background:#0d1f3a;border:1px solid #1a3a6a;border-radius:10px;padding:11px 15px;margin-bottom:16px;display:flex;align-items:center;flex-wrap:wrap;gap:9px;">'+
      '<span style="color:#3a5a8a;font-size:10px;letter-spacing:3px;flex-shrink:0">JUGADORES</span>'+
      '<div style="display:flex;flex-wrap:wrap;gap:7px;flex:1">'+jugadoresHtml+'</div>'+
      '<div style="display:flex;gap:7px;">'+
        '<input id="nuevo-jugador" placeholder="Nuevo jugador..." style="background:#0a1628;border:1px solid #1a3a6a;color:#e8eaf0;padding:5px 11px;border-radius:8px;font-size:13px;outline:none;font-family:Georgia,serif"/>'+
        '<button id="btn-agregar" style="background:#1a3a6a;border:none;color:#f5c518;padding:5px 13px;border-radius:8px;cursor:pointer;font-size:13px;font-family:Georgia,serif">+ Agregar</button>'+
      '</div>'+
    '</div>'+
    htmlSelectorFase()+
    (faseActiva===FASES.GRUPOS?htmlSelectorGrupos():"")+
    '<div style="font-size:13px;color:#5a7aaa;margin-bottom:14px"><b style="color:#f5c518">'+jugadorActivo+'</b> &middot; '+faseActiva+grupoInfo+'</div>'+
    '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:13px;">'+
      partidos.map(function(p){return htmlCardPron(p);}).join("")+
    '</div>'+
    htmlResumen();
}

function htmlCardPron(p){
  const k = clave(jugadorActivo,p.id);
  const pr = estado.pronosticos[k]||{};
  const ok = partidoJugado(p);
  const pts = ok?calcPuntos(pr,p):null;
  const bloq = esBloqueado(p.fechaISO);
  const realR = ok?signo(p.gLocal,p.gVisitante):null;
  const fechaStr = p.fechaISO?`🗓 ${new Date(p.fechaISO).toLocaleDateString("es-AR",{weekday:"short",day:"numeric",month:"short"})} · ${new Date(p.fechaISO).toLocaleTimeString("es-AR",{hour:"2-digit",minute:"2-digit"})} hs`:"";
  const bts = [{val:"L",label:"Local",color:"#3a7aff"},{val:"E",label:"Empate",color:"#7090c0"},{val:"V",label:"Visitante",color:"#f59e0b"}];
  return `
  <div style="background:#0d1f3a;border:1px solid #1a3a6a;border-radius:12px;padding:13px 16px;position:relative;${bloq?"opacity:.88":""}">
    ${pts!==null?`<div style="position:absolute;top:10px;right:10px;background:${pts===1?"#22c55e":"#ef4444"};color:#fff;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:700">${pts} pt</div>`:""}
    <div style="font-size:9px;color:#3a5a8a;margin-bottom:6px;letter-spacing:2px"><b style="color:#f5c518">${p.cod}</b> · ${p.fase}${bloq?'<span style="margin-left:7px;color:#f59e0b;font-size:9px">🔒 Bloqueado</span>':""}</div>
    ${p.sede?`<div style="font-size:9px;color:#3a5a8a;margin-bottom:5px">📍 ${p.sede}</div>`:""}
    ${fechaStr?`<div style="font-size:10px;color:#5a7aaa;margin-bottom:7px">${fechaStr}</div>`:""}
    <div style="display:flex;align-items:center;justify-content:space-between;gap:5px;margin-bottom:10px">
      <div style="display:flex;align-items:center;gap:4px;flex:1;min-width:0">
        <span style="font-size:19px">${bf(p.local)}</span>
        <span style="font-size:12px;font-weight:600;color:#c0d0e8;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${p.local}</span>
      </div>
      <span style="color:#3a5a8a;font-size:11px;flex-shrink:0">vs</span>
      <div style="display:flex;align-items:center;gap:4px;flex:1;min-width:0;justify-content:flex-end">
        <span style="font-size:12px;font-weight:600;color:#c0d0e8;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${p.visitante}</span>
        <span style="font-size:19px">${bf(p.visitante)}</span>
      </div>
    </div>
    <div style="display:flex;gap:6px;justify-content:center;">
      ${bts.map(({val,label,color})=>{
        const sel=pr.resultado===val;
        const correcto=ok&&realR===val;
        return `<button data-pron="${p.id}" data-val="${val}" ${bloq?"disabled":""}
          style="flex:1;border:1px solid ${sel?color:(ok&&correcto?"#22c55e":"#1a3a6a")};border-radius:8px;padding:8px 4px;
          background:${sel?color:"transparent"};color:${sel?"#fff":(ok&&correcto?"#22c55e":color)};
          cursor:${bloq?"not-allowed":"pointer"};opacity:${bloq?0.6:1};
          box-shadow:${sel?`0 0 10px ${color}66`:"none"};font-family:Georgia,serif;transition:all .2s;">
          <div style="font-size:15px;font-weight:800">${val}</div>
          <div style="font-size:9px;margin-top:1px;opacity:.8">${label}</div>
        </button>`;
      }).join("")}
    </div>
    ${ok?`<div style="margin-top:8px;text-align:center;font-size:11px;color:#5a7aaa">Real: ${p.gLocal}–${p.gVisitante} · (${realR==="L"?"Local":realR==="V"?"Visitante":"Empate"})</div>`:""}
  </div>`;
}

function htmlResumen(){
  const jugados = estado.partidos.filter(p=>partidoJugado(p));
  if(!jugados.length) return "";
  const aciertos = jugados.filter(p=>calcPuntos(estado.pronosticos[clave(jugadorActivo,p.id)],p)===1).length;
  const pts = jugados.reduce((acc,p)=>acc+(calcPuntos(estado.pronosticos[clave(jugadorActivo,p.id)],p)||0),0);
  const items=[{l:"Partidos",v:jugados.length,c:"#7090c0"},{l:"Aciertos ✅",v:aciertos,c:"#22c55e"},{l:"Errores ❌",v:jugados.length-aciertos,c:"#ef4444"},{l:"Puntos",v:pts,c:"#f5c518"}];
  return `<div style="background:#0d1f3a;border:1px solid #1a3a6a;border-radius:12px;padding:16px 20px;margin-top:22px;">
    <div style="font-size:11px;color:#5a7aaa;letter-spacing:2px;margin-bottom:12px">RESUMEN DE ${jugadorActivo.toUpperCase()}</div>
    <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:10px;">
      ${items.map(({l,v,c})=>`<div style="background:#0a1628;border-radius:8px;padding:10px 14px;text-align:center;">
        <div style="font-size:26px;font-weight:700;color:${c}">${v}</div>
        <div style="font-size:10px;color:#5a7aaa;margin-top:2px">${l}</div>
      </div>`).join("")}
    </div>
  </div>`;
}

// ── Event binding ────────────────────────────────────────────────────────────
function bindEvents(){
  // Tabs
  document.querySelectorAll("[data-tab]").forEach(b=>{
    b.onclick = function(){ tabActiva=this.dataset.tab; renderApp(); };
  });
  // Fases
  document.querySelectorAll("[data-fase]").forEach(b=>{
    b.onclick = function(){ faseActiva=this.dataset.fase; renderApp(); };
  });
  // Grupos
  document.querySelectorAll("[data-grupo]").forEach(b=>{
    b.onclick = function(){ grupoActivo=this.dataset.grupo; renderApp(); };
  });

  // Resultados: goles y equipos
  document.querySelectorAll("input[data-pid][data-field]").forEach(inp=>{
    inp.onchange = function(){
      const pid=+this.dataset.pid;
      const f=this.dataset.field;
      const p=estado.partidos.find(x=>x.id===pid);
      if(!p) return;
      if(f==="gLocal"||f==="gVisitante") p[f]=this.value===""?null:Number(this.value);
      else if(f==="fecha") p.fechaISO=this.value?this.value+":00":null;
      else p[f]=this.value;
      guardarEnFirebase();
      renderApp();
    };
  });

  // Pronósticos L/E/V
  document.querySelectorAll("[data-pron]").forEach(b=>{
    b.onclick = function(){
      const pid=+this.dataset.pron, val=this.dataset.val;
      const k=clave(jugadorActivo,pid);
      if(!estado.pronosticos[k]) estado.pronosticos[k]={};
      estado.pronosticos[k].resultado=val;
      guardarEnFirebase();
      renderApp();
    };
  });

  // Seleccionar jugador
  document.querySelectorAll("[data-sel-jugador]").forEach(b=>{
    b.onclick = function(){ jugadorActivo=this.dataset.selJugador; renderApp(); };
  });

  // Eliminar jugador
  document.querySelectorAll("[data-del-jugador]").forEach(b=>{
    b.onclick = function(){
      const j=this.dataset.delJugador;
      if(!confirm(`¿Eliminás a ${j} del PRODE? Se borrarán todos sus pronósticos.`)) return;
      estado.jugadores=estado.jugadores.filter(x=>x!==j);
      Object.keys(estado.pronosticos).forEach(k=>{if(k.startsWith(`${j}__`))delete estado.pronosticos[k];});
      if(jugadorActivo===j) jugadorActivo=estado.jugadores[0]||"";
      guardarEnFirebase();
      renderApp();
    };
  });

  // Agregar jugador
  const btnAgregar=document.getElementById("btn-agregar");
  const inputNuevo=document.getElementById("nuevo-jugador");
  const agregarJugador=()=>{
    const n=inputNuevo?.value.trim();
    if(n&&!estado.jugadores.includes(n)){
      estado.jugadores.push(n);
      jugadorActivo=n;
      guardarEnFirebase();
      renderApp();
    }
  };
  if(btnAgregar) btnAgregar.addEventListener("click",agregarJugador);
  if(inputNuevo) inputNuevo.addEventListener("keydown",e=>{if(e.key==="Enter")agregarJugador();});
}

// ── Init ─────────────────────────────────────────────────────────────────────
document.getElementById("app").innerHTML = htmlCargando();
escucharFirebase();
</script>
</head>
<body style="margin:0;padding:0;background:#050d1a;">
  <div id="app"></div>
</body>
</html>
